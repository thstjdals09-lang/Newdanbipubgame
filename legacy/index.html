<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newdanbipubgame</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="hud">
      <h1 class="hud__title">Newdanbipubgame</h1>
      <div class="hud__stats">
        <span id="stat-fps">FPS --</span>
      </div>
    </header>

    <main class="stage">
      <canvas id="game" width="960" height="540"></canvas>
    </main>

    <footer class="log">
      <p id="log-line">초기 프로젝트 골격입니다.</p>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
